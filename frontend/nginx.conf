server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback -- client-side routing (not heavily used here, but
    # this keeps direct refreshes on any path working).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: if you run frontend+backend behind the same nginx/host,
    # uncomment and point this at the backend container/service so the
    # frontend can call same-origin /api instead of a separate
    # VITE_API_BASE_URL. Left disabled by default since docker-compose.yml
    # runs them as two independently-addressable services.
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    #     proxy_set_header Host $host;
    # }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
